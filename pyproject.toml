[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libraryan"
version = "0.3.1"
description = "A vendor-neutral docs agent: the only writer of a git project's Markdown knowledge base; every other agent files a request"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "narek-mn"}]
keywords = ["ai-agents", "coding-agents", "llm", "documentation", "docs-as-code", "markdown", "knowledge-base", "agents-md", "claude-code", "codex", "cursor", "gemini-cli", "github-copilot", "git-hooks", "pre-commit", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Documentation",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/narek-mn/libraryan"
Documentation = "https://github.com/narek-mn/libraryan/blob/main/docs/guide.md"
Repository = "https://github.com/narek-mn/libraryan"
Issues = "https://github.com/narek-mn/libraryan/issues"
Changelog = "https://github.com/narek-mn/libraryan/blob/main/CHANGELOG.md"

[project.scripts]
libraryan = "libraryan.cli:entry"

[tool.setuptools]
packages = ["libraryan", "libraryan.runtimes"]

[tool.setuptools.package-data]
libraryan = ["_runtime/**/*", "_templates/**/*"]

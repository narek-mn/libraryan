[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libraryan"
version = "0.4.0"
description = "Keep your Markdown docs true to your code: a free checker and an AI fixer that never commits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "narek-mn"}]
keywords = ["ai-agents", "coding-agents", "llm", "documentation", "docs-as-code", "markdown", "broken-links", "agents-md", "claude-code", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Documentation",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/narek-mn/libraryan"
Repository = "https://github.com/narek-mn/libraryan"
Issues = "https://github.com/narek-mn/libraryan/issues"
Changelog = "https://github.com/narek-mn/libraryan/blob/main/CHANGELOG.md"

[project.scripts]
libraryan = "libraryan.cli:entry"

[tool.setuptools]
packages = ["libraryan"]

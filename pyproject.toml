[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libraryan"
version = "0.2.0"
description = "A Claude Code agent that owns, structures and maintains a git project's Markdown knowledge base"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "narek-mn"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Documentation",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/narek-mn/libraryan"
Repository = "https://github.com/narek-mn/libraryan"

[project.scripts]
libraryan = "libraryan.cli:entry"

[tool.setuptools]
packages = ["libraryan"]

[tool.setuptools.package-data]
libraryan = ["_runtime/**/*", "_templates/**/*"]

name: publish

# Push a tag like v0.2.0 (matching pyproject's version): test, build, publish to PyPI, then create the GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
      - run: pip install pytest "setuptools>=77" build twine
      - run: python -m pytest tests -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/libraryan/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '/^## / { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          printf '\nInstall: `pipx install libraryan==%s`\n' "${GITHUB_REF_NAME#v}" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
